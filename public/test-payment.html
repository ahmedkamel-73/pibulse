<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Payment</title><script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>body{background:#08080a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}button{padding:20px 30px;border-radius:16px;border:0;background:#7c4dff;color:#fff;font-weight:900;font-size:18px;cursor:pointer}</style>
</head><body>
<div>
<h2>💸 اختبار دفع Pi</h2>
<p id="user">سجل دخول...</p>
<button onclick="login()">1. تسجيل دخول Pi</button><br><br>
<button onclick="pay()" style="background:#00e676;color:#000">2. ادفع 1 Test-Pi</button>
<p id="status" style="margin-top:20px;color:#a99cff"></p>
</div>
<script>
Pi.init({version:"2.0", sandbox:true});
async function login(){
 document.getElementById('status').innerText='Opening wallet...';
 try{
  const auth=await Pi.authenticate(['username','payments'], p=>fetch("/api/payment/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction.txid})}));
  document.getElementById('user').innerText='@'+auth.user.username+' متصل';
  document.getElementById('status').innerText='جاهز للدفع';
 }catch(e){alert(e.message)}
}
async function pay(){
 document.getElementById('status').innerText='Creating...';
 try{
  await Pi.createPayment({amount:1,memo:"PiBulse verification",metadata:{test:1}},{
   onReadyForServerApproval: async id=>{await fetch("/api/payment/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id})}); document.getElementById('status').innerText='Approving...';},
   onReadyForServerCompletion: async (id,txid)=>{await fetch("/api/payment/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id,txid})}); document.getElementById('status').innerText='✅ نجح! روح Pi Portal اعمل Verify'; alert('✅ نجح');},
   onCancel:()=>document.getElementById('status').innerText='لغيت',
   onError:e=>{document.getElementById('status').innerText='خطأ: '+e; alert(e);}
  });
 }catch(e){alert(e.message)}
}
</script>
</body></html>
