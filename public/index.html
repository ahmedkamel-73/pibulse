<style>
:root{--bg:#08080a;--pi:#7c4dff;--green:#00e676;--red:#ff5252}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Cairo',sans-serif}
body{background:radial-gradient(1200px 600px at 50% -10%, #1a1033, var(--bg));color:#fff;min-height:100vh;display:flex;flex-direction:column}
.header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;max-width:440px;margin:0 auto;width:100%}
.logo{font-size:26px;font-weight:900;background:linear-gradient(90deg,#fff,var(--pi));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lang{background:#1e1e28;border:1px solid #2a2a38;color:#fff;padding:6px 14px;border-radius:99px;font-size:12px;cursor:pointer}
.container{max-width:440px;margin:0 auto;padding:0 16px;width:100%;flex:1}
.glass{background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:20px;margin-top:10px}
.badge{background:#1e1e28;border:1px solid #2a2a38;border-radius:999px;padding:6px 12px;font-size:11px;color:#bdbdc9;display:inline-block;margin:2px;direction:ltr}
.progress{height:8px;background:#1e1e28;border-radius:99px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pi),#00e5ff);transition:.5s}
.price{font-size:38px;font-weight:900;text-align:center;direction:ltr;margin:12px 0;min-height:60px;line-height:1.1}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.btn{padding:18px;border-radius:16px;border:0;font-size:16px;font-weight:900;cursor:pointer;transition:.2s;opacity:0.5;pointer-events:none}
.btn.active{opacity:1;pointer-events:auto}
.btn.locked{opacity:0.2;pointer-events:none;filter:grayscale(1)}
.up{background:linear-gradient(180deg,#00e676,#00a152);color:#000}
.down{background:linear-gradient(180deg,#ff5252,#b71c1c);color:#fff}
.pi-login{width:100%;padding:16px;border-radius:14px;border:0;background:linear-gradient(90deg,var(--pi),#9c7cff);color:#fff;font-weight:900;font-size:14px;cursor:pointer;margin-top:14px}
.status{margin-top:14px;padding:12px;border-radius:12px;background:#101015;border:1px dashed #2a2a38;color:#c7c7d1;font-size:12px;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;direction:ltr}
.status.warning{background:rgba(255,82,82,0.15);border-color:var(--red);color:#ffb4b4;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.ad-box{margin-top:16px;border-radius:16px;border:1px dashed rgba(124,77,255,0.4);background:rgba(124,77,255,0.08);padding:0;overflow:hidden;text-align:center}
.ad-box.label{font-size:10px;color:#a99cff;padding:6px;background:rgba(124,77,255,0.15)}
.footer{text-align:center;padding:20px;color:#666;font-size:11px;border-top:1px solid #1a1a24;margin-top:20px}
.footer a{color:var(--pi);text-decoration:none;margin:0 8px}
</style>

<body>
<div class="header"><div class="logo">PIBULSE</div><button class="lang" onclick="toggleLang()" id="langBtn">العربية</button></div>
<div class="container">
<div class="glass">
<div style="text-align:center"><span class="badge" id="userBadge">Not Connected</span><span class="badge"><span id="ptsTxt">Points</span>: <span id="pts">10</span>/10</span></div>
<div class="progress"><i id="bar" style="width:100%"></i></div>
<div style="margin-top:16px"><div style="color:#9e9eaa;font-size:11px;text-align:center" id="liveTxt">● PI NETWORK - LIVE</div><div class="price" id="price">Loading PI Price...</div><div style="text-align:center;color:#00e5ff;font-weight:700;font-size:13px" id="timer">Syncing rounds...</div><div style="text-align:center;color:#999;font-size:10px;margin-top:4px" id="roundInfo">4 rounds / day - Cairo</div></div>
<button class="pi-login" id="loginBtn" onclick="loginPi()">🔗 Connect Pi Wallet to Play</button>
<div class="btns"><button class="btn up" id="upBtn" onclick="play('up')">📈 UP</button><button class="btn down" id="downBtn" onclick="play('down')">📉 DOWN</button></div>
<div class="status" id="status">Connect Pi Wallet - Real wallet required</div>
</div>

<div class="ad-box">
<div class="label">Pi Ad Network - Sponsored</div>
<div id="pi-ad-container" style="min-height:90px;display:flex;align-items:center;justify-content:center;background:#0f0f14;color:#666;font-size:11px">
Loading Pi Ad...
</div>
</div>

<div class="glass" style="padding:14px"><h3 style="font-size:12px;color:#9e9eaa;margin-bottom:8px">🏆 Live Round - Transparent</h3><div id="board">No data yet</div></div>
</div>
<footer class="footer"><a href="/about.html">About</a> | <a href="/terms.html">Terms</a> | <a href="/api/leaderboard" target="_blank">API</a><br>© 2026 PIBULSE - Real Wallet + Pi Ads</footer>
<script>
let lang=localStorage.getItem('pibulse_lang')||'en';
let piUser=null;
const t={en:{pts:'Points',live:'PI NETWORK - LIVE',next:'Next round:',locked:'LOCKED - Waiting result',up:'📈 UP',down:'📉 DOWN',connect:'🔗 Connect Pi Wallet to Play',need:'Connect your Pi Wallet first',ready:'Wallet connected - Predict now!',btn:'العربية',noPts:'No points',warn5:'⚠️ 5 min left - Prediction closing!',warn1:'⏰ 1 min left!'},ar:{pts:'نقاطك',live:'شبكة PI - مباشر',next:'الجولة القادمة:',locked:'مقفولة - انتظار النتيجة',up:'📈 صعود',down:'📉 هبوط',connect:'🔗 اربط محفظة Pi للعب',need:'اربط محفظتك أولا',ready:'المحفظة مربوطة - توقع الآن',btn:'English',noPts:'انتهت النقاط',warn5:'⚠️ فاضل 5 دقايق والتوقع هيقفل!',warn1:'⏰ فاضل دقيقة واحدة!'}};
function applyLang(){document.getElementById('html').dir=lang=='ar'?'rtl':'ltr';document.getElementById('ptsTxt').innerText=t[lang].pts;document.getElementById('liveTxt').innerText=t[lang].live;document.getElementById('upBtn').innerText=t[lang].up;document.getElementById('downBtn').innerText=t[lang].down;document.getElementById('langBtn').innerText=t[lang].btn;if(!piUser)document.getElementById('loginBtn').innerText=t[lang].connect;}
function toggleLang(){lang=lang=='en'?'ar':'en';localStorage.setItem('pibulse_lang',lang);applyLang();}applyLang();
let points=parseInt(localStorage.getItem('pibulse_v2_pts')||'10');
function renderPts(){document.getElementById('pts').innerText=points.toLocaleString('en-US');document.getElementById('bar').style.width=(points*10)+'%'}renderPts();

async function loginPi(){
  try{
    document.getElementById('status').innerText='Opening Pi Wallet...';
    Pi.init({version:"2.0", sandbox:false});
    const auth=await Pi.authenticate(['username','payments','wallet_address'],()=>{});
    piUser={username:auth.user.username,uid:auth.user.uid,wallet:auth.user.wallet_address,accessToken:auth.accessToken};
    localStorage.setItem('pibulse_user',JSON.stringify(piUser));
    document.getElementById('userBadge').innerText=auth.user.username+' | '+auth.user.wallet_address.slice(0,4)+'...'+auth.user.wallet_address.slice(-4);
    document.getElementById('loginBtn').style.display='none';
    document.getElementById('upBtn').classList.add('active');document.getElementById('downBtn').classList.add('active');
    document.getElementById('status').innerText='Connected @'+auth.user.username+' - '+t[lang].ready;
    loadPiAd();
  }catch(e){document.getElementById('status').innerText='Open in Pi Browser to connect wallet';}
}

async function play(dir){
  if(!piUser){document.getElementById('status').innerText=t[lang].need;return;}
  if(points<=0){document.getElementById('status').innerText=t[lang].noPts;return;}
  if(window.currentIsLocked){document.getElementById('status').innerText=t[lang].locked;return;}
  try{await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:piUser.username,wallet_address:piUser.wallet,uid:piUser.uid,dir})});document.getElementById('status').innerText='✅ '+dir.toUpperCase()+' saved for @'+piUser.username;}catch(e){}
  points--;localStorage.setItem('pibulse_v2_pts',points);renderPts();loadBoard();
}

function loadPiAd(){
  try{
    if(window.Pi && Pi.Ads){
      Pi.Ads.showAd('interstitial').then(()=>{document.getElementById('pi-ad-container').innerHTML='Pi Ad Shown ✅';}).catch(()=>{document.getElementById('pi-ad-container').innerHTML='Pi Ad Space - Your Ad Here';});
    }else{
      document.getElementById('pi-ad-container').innerHTML='Pi Ad Network Ready<br><span style="font-size:10px">Will show in Pi Browser</span>';
    }
  }catch(e){document.getElementById('pi-ad-container').innerHTML='Pi Ad Space';}
}

async function fetchPi(){
  try{let p=0;try{const r=await fetch('/api/price');const d=await r.json();if(d.price)p=d.price;else throw 0;}catch{const r2=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=pi-network&vs_currencies=usd');const d2=await r2.json();p=d2['pi-network'].usd;}document.getElementById('price').innerHTML='$'+p.toLocaleString('en-US',{minimumFractionDigits:4})+'<span style="font-size:11px;color:#00e676;display:block">● LIVE PI</span>';}catch{}
}

// ====== FIXED PROFESSIONAL TIMER SYSTEM - NO UNDEFINED ======
let serverData = null;
let notified5 = false;
let notified1 = false;

async function syncRound(){
  try{
    const r = await fetch('/api/round');
    const d = await r.json();
    serverData = d;
    localStorage.setItem('pibulse_round_cache', JSON.stringify({data: d, fetchedAt: Date.now()}));
    window.currentIsLocked = d.isLocked;
    renderRoundInfo();
  }catch(e){
    const cache = localStorage.getItem('pibulse_round_cache');
    if(cache){ try{ serverData = JSON.parse(cache).data; }catch{} }
  }
}

function renderRoundInfo(){
  if(!serverData) return;
  if(serverData.isLocked){
    document.getElementById('upBtn').classList.add('locked');
    document.getElementById('downBtn').classList.add('locked');
    document.getElementById('status').innerText = t[lang].locked;
    document.getElementById('status').classList.add('warning');
  } else {
    if(piUser){
      document.getElementById('upBtn').classList.add('active');
      document.getElementById('downBtn').classList.add('active');
      document.getElementById('upBtn').classList.remove('locked');
      document.getElementById('downBtn').classList.remove('locked');
    }
    document.getElementById('status').classList.remove('warning');
  }
}

function updateTimerFromServer(){
  if(!serverData) return;
  const now = Date.now();
  let secLock = serverData.secondsUntilLock;
  let secNext = serverData.secondsUntilNext;
  
  if(serverData.lockTime){
    secLock = Math.floor((new Date(serverData.lockTime).getTime() - now)/1000);
    secNext = Math.floor((new Date(serverData.nextRound).getTime() - now)/1000);
  } else if (serverData.fetchedAt) {
    const elapsed = Math.floor((now - serverData.fetchedAt)/1000);
    secLock -= elapsed;
    secNext -= elapsed;
  }

  // === FIX: منع كلمة undefined نهائيا ===
  const roundLabel = serverData.nextRoundCairo || serverData.roundId || (serverData.schedule && serverData.schedule[0]) || "18:00";
  const safeRoundLabel = String(roundLabel).replace('undefined', '18:00');

  if(secLock > 0 && !serverData.isLocked){
    const h = Math.floor(secLock/3600); const m = Math.floor((secLock%3600)/60); const s = secLock%60;
    document.getElementById('timer').innerText = t[lang].next + ` ${h>0?h+'h ':''}${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s | Lock in ${m}m`;
    document.getElementById('roundInfo').innerText = `Round @ ${safeRoundLabel} - Cairo | ${serverData.isLocked?'LOCKED':'OPEN'}`;
    
    if(secLock <= 300 && secLock > 295 && !notified5){
      notified5 = true;
      triggerAlert(t[lang].warn5, 5);
    }
    if(secLock <= 60 && secLock > 55 && !notified1){
      notified1 = true;
      triggerAlert(t[lang].warn1, 1);
    }
  } else if (secLock <= 0 && secNext > 0){
    const h = Math.floor(secNext/3600); const m = Math.floor((secNext%3600)/60); const s = secNext%60;
    document.getElementById('timer').innerText = `🔒 ${t[lang].locked} - ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.getElementById('roundInfo').innerText = `Locked until ${safeRoundLabel} Cairo`;
  } else {
    document.getElementById('timer').innerText = 'Calculating result...';
    syncRound();
    notified5 = false; notified1 = false;
  }
}

function triggerAlert(msg, mins){
  document.getElementById('status').innerText = msg;
  document.getElementById('status').classList.add('warning');
  try{
    if(Notification && Notification.permission === 'granted'){
      new Notification('PiBulse', { body: msg, icon: '/icon.png' });
    }
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }catch{}
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); o.frequency.value = mins===5?880:1200; o.connect(ctx.destination); o.start(); setTimeout(()=>o.stop(), 400);
  }catch{}
}

async function loadBoard(){
  try{
    const r=await fetch('/api/round');
    const d=await r.json();
    const roundId = d.roundId || d.nextRoundCairo || '18:00';
    const safeId = String(roundId).replace('undefined','18:00');
    const price = d.roundStartPrice || d.currentPrice || 0;
    let h='Round #'+safeId+' | Start $'+Number(price).toFixed(4)+'<br><br>';
    const preds = d.predictions || [];
    if(preds.length==0)h+='<span style="color:#666">No predictions yet</span>';
    else preds.slice(-5).forEach(x=>{h+='<div style="padding:6px 10px;background:#101015;border-radius:8px;margin-bottom:5px;font-size:11px;display:flex;justify-content:space-between"><span>@'+x.username+'</span><span style="color:'+(x.dir=='up'?'#00e676':'#ff5252')+'">'+x.dir.toUpperCase()+'</span></div>'});
    document.getElementById('board').innerHTML=h;
  }catch{}
}

// Init
try{const u=JSON.parse(localStorage.getItem('pibulse_user'));if(u){piUser=u;document.getElementById('userBadge').innerText=u.username+' | '+u.wallet.slice(0,4)+'...';document.getElementById('loginBtn').style.display='none';document.getElementById('upBtn').classList.add('active');document.getElementById('downBtn').classList.add('active');}}catch{}
if(Notification) Notification.requestPermission();
fetchPi(); loadBoard(); loadPiAd(); syncRound();
setInterval(fetchPi,10000);
setInterval(loadBoard,5000);
setInterval(syncRound,15000);
setInterval(updateTimerFromServer,1000);
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
