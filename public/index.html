<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIBULSE</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#1a1a1a;--purple:#8b5cf6;--cyan:#06b6d4;--green:#22c55e;--red:#ef4444}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui;direction:ltr}
.wrap{max-width:420px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.logo{font-weight:900;font-size:28px;letter-spacing:-1px}
.logo span{color:var(--purple)}
.badge{border:1px solid #333;padding:6px 14px;border-radius:20px;font-size:13px;background:#111}
.card{background:linear-gradient(180deg,#1e1e1e,#121212);border:1px solid #2a2a2a;border-radius:24px;padding:18px;margin-top:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pills{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.pill{background:#111;border:1px solid #2a2a2a;border-radius:20px;padding:6px 12px;font-size:12px}
.bar{height:8px;background:#222;border-radius:10px;overflow:hidden;margin:12px 0}
.bar>div{height:100%;width:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}
.price-label{color:#888;font-size:12px;letter-spacing:2px;text-align:center;margin-top:10px}
.price{font-size:48px;font-weight:900;text-align:center;line-height:1}
.live{color:var(--green);font-size:12px;text-align:center;font-weight:700}
.timer{color:var(--cyan);text-align:center;margin:14px 0 4px;font-weight:800;font-size:15px}
.roundinfo{color:#888;text-align:center;font-size:13px;margin-bottom:14px}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:16px;cursor:pointer}
.btn-connect{background:var(--purple);color:#fff}
.row{display:flex;gap:12px;margin-top:12px}
.btn-up{flex:1;background:var(--green);color:#000}
.btn-down{flex:1;background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{border:1px dashed #333;border-radius:12px;padding:12px;text-align:center;color:#aaa;font-size:13px;margin-top:12px}
.ad{border:1px dashed #4f46e5;background:#111126;border-radius:16px;padding:16px;margin-top:18px;text-align:center}
.live-round{margin-top:18px;background:#171717;border:1px solid #2a2a2a;border-radius:20px;padding:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">PI<span>BULSE</span></div>
    <div class="badge">العربية</div>
  </div>

  <div class="card">
    <div class="pills">
      <div class="pill" id="conn">Not Connected</div>
      <div class="pill">Points: 10/10</div>
    </div>
    <div class="bar"><div></div></div>
    <div class="price-label">PI NETWORK - LIVE</div>
    <div class="price" id="piPrice">$0.0978</div>
    <div class="live">● LIVE PI</div>

    <div class="timer" id="timer">Next round: -- | Lock in --</div>
    <div class="roundinfo" id="roundInfo">Round @ -- - Cairo | OPEN</div>

    <button class="btn btn-connect" id="connectBtn">🔗 Connect Pi Wallet to Play</button>
    <div class="row">
      <button class="btn btn-up" id="upBtn" disabled>📈 UP</button>
      <button class="btn btn-down" id="downBtn" disabled>📉 DOWN</button>
    </div>
    <div class="note" id="note">Connect Pi Wallet - Real wallet required</div>
  </div>

  <div class="ad">
    <div style="font-weight:800;margin-bottom:10px">Pi Ad Network - Sponsored</div>
    <div style="color:#666;font-size:13px">Pi Ad Space - Your Ad Here</div>
  </div>

  <div class="live-round">
    <div style="color:#aaa;font-size:14px">🏆 Live Round - Transparent</div>
    <div style="font-weight:800;margin-top:6px" id="liveRoundLabel">Round #-- | Start $0.0955</div>
    <div style="color:#666;margin-top:8px" id="predList">No predictions yet</div>
  </div>
</div>

<script>
Pi.init({ version: "2.0", sandbox: false });

let piUser = null;
let currentRound = null;

// 1. Live Price
async function loadPrice(){
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=pi-network&vs_currencies=usd');
    const j = await r.json();
    if(j['pi-network']?.usd){
      document.getElementById('piPrice').textContent = '$'+j['pi-network'].usd.toFixed(4);
    }
  }catch(e){}
}
loadPrice();
setInterval(loadPrice, 30000);

// 2. Round logic - Fixed undefined
async function loadRound(){
  try{
    const res = await fetch('/api/round', { cache: 'no-store' });
    const data = await res.json();
    currentRound = data;
    
    // Fix: كان بيقرا data.roundTime اللي مش موجودة
    const roundDisplay = data.roundId || '18:00';
    const lockInMin = Math.max(0, Math.floor(data.secondsUntilLock / 60));
    
    document.getElementById('roundInfo').textContent = `Round @ ${roundDisplay} - Cairo | ${data.isLocked ? 'LOCKED' : 'OPEN'}`;
    document.getElementById('liveRoundLabel').textContent = `Round #${roundDisplay} | Start $${(data.roundStartPrice || 0.0955).toFixed(4)}`;
    
    startCountdown(data.secondsUntilNext, data.secondsUntilLock, roundDisplay, data.isLocked);
  }catch(e){
    console.log('round error', e);
    // Fallback لو API مش شغال
    document.getElementById('roundInfo').textContent = 'Round @ 18:00 - Cairo | OPEN';
  }
}

let timerInterval = null;
function startCountdown(secNext, secLock, roundId, isLocked){
  if(timerInterval) clearInterval(timerInterval);
  let sNext = secNext;
  let sLock = secLock;
  timerInterval = setInterval(()=>{
    sNext--; sLock--;
    if(sNext < 0) { loadRound(); return; }
    const h = Math.floor(sNext/3600), m = Math.floor((sNext%3600)/60), s = sNext%60;
    const lockText = sLock > 0 ? `Lock in ${Math.floor(sLock/60)}m` : 'LOCKED';
    document.getElementById('timer').textContent = `Next round: ${h}h ${m}m ${s}s | ${lockText}`;
    document.getElementById('roundInfo').textContent = `Round @ ${roundId} - Cairo | ${sLock <= 0 ? 'LOCKED' : 'OPEN'}`;
    if(sLock <= 0){
      document.getElementById('upBtn').disabled = true;
      document.getElementById('downBtn').disabled = true;
    }
  }, 1000);
}

loadRound();

// 3. Connect Pi
document.getElementById('connectBtn').addEventListener('click', async ()=>{
  try{
    const auth = await Pi.authenticate(['username','payments'], (p)=>{});
    piUser = auth.user;
    document.getElementById('conn').textContent = '@' + piUser.username;
    document.getElementById('connectBtn').textContent = '✅ Connected: @' + piUser.username;
    document.getElementById('upBtn').disabled = false;
    document.getElementById('downBtn').disabled = false;
    document.getElementById('note').textContent = 'Choose UP or DOWN for next round';
  }catch(e){
    alert('Connect failed, open in Pi Browser');
  }
});

// 4. Predictions
async function predict(dir){
  if(!piUser){ alert('Connect wallet first'); return; }
  if(!currentRound){ alert('Round not loaded'); return; }
  try{
    const res = await fetch('/api/predict', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ direction: dir, roundId: currentRound.roundId, username: piUser.username })
    });
    const j = await res.json();
    document.getElementById('predList').textContent = `You predicted ${dir} for ${currentRound.roundId}`;
    document.getElementById('upBtn').disabled = true;
    document.getElementById('downBtn').disabled = true;
  }catch(e){
    document.getElementById('predList').textContent = `You predicted ${dir} (local)`;
  }
}
document.getElementById('upBtn').onclick = ()=>predict('UP');
document.getElementById('downBtn').onclick = ()=>predict('DOWN');
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
