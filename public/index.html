<!DOCTYPE html>
<html lang="en" dir="ltr" id="html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIBULSE - PI Live</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#08080a;--pi:#7c4dff;--green:#00e676;--red:#ff5252;--gold:#ffca28}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Cairo',sans-serif}
body{background:radial-gradient(1200px 600px at 50% -10%, #1a1033, var(--bg));color:#fff;min-height:100vh}
.header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;max-width:440px;margin:0 auto}
.logo{font-size:26px;font-weight:900;background:linear-gradient(90deg,#fff,var(--pi));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lang{background:#1e1e28;border:1px solid #2a2a38;color:#fff;padding:6px 14px;border-radius:99px;font-size:12px;cursor:pointer}
.container{max-width:440px;margin:0 auto;padding:0 16px 30px}
.glass{background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:20px;margin-top:10px}
.badge{background:#1e1e28;border:1px solid #2a2a38;border-radius:999px;padding:6px 12px;font-size:11px;color:#bdbdc9;display:inline-block;margin:2px}
.badge span{color:var(--gold);font-weight:700}
.progress{height:8px;background:#1e1e28;border-radius:99px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pi),#00e5ff);transition:.5s}
.price{font-size:42px;font-weight:900;text-align:center;direction:ltr;margin:12px 0}
.price small{font-size:14px;display:block;margin-top:4px}
.timer{color:#00e5ff;font-weight:700;text-align:center;font-size:13px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.btn{padding:18px;border-radius:16px;border:0;font-size:16px;font-weight:900;cursor:pointer}
.up{background:linear-gradient(180deg,#00e676,#00a152);color:#000}
.down{background:linear-gradient(180deg,#ff5252,#b71c1c);color:#fff}
.status{margin-top:16px;padding:12px;border-radius:12px;background:#101015;border:1px dashed #2a2a38;color:#c7c7d1;font-size:12px;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center}
.ad-box{margin-top:16px;border-radius:16px;border:1px dashed rgba(124,77,255,0.4);background:rgba(124,77,255,0.06);padding:14px;text-align:center;color:#a99cff;font-size:11px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">PIBULSE</div>
  <button class="lang" onclick="toggleLang()" id="langBtn">العربية</button>
</div>
<div class="container">
  <div class="glass">
    <div style="text-align:center">
      <span class="badge">Prize: GD2C...RYDO</span>
      <span class="badge"><span id="ptsTxt">Points</span>: <span id="pts">10</span>/10</span>
    </div>
    <div class="progress"><i id="bar" style="width:100%"></i></div>
    <div style="margin-top:16px">
      <div style="color:#9e9eaa;font-size:11px;text-align:center" id="liveTxt">PI NETWORK - Live Price</div>
      <div class="price" id="price">Loading...</div>
      <div class="timer" id="timer">Next round: 60s</div>
    </div>
    <div class="btns">
      <button class="btn up" onclick="play('up')" id="upBtn">📈 UP</button>
      <button class="btn down" onclick="play('down')" id="downBtn">📉 DOWN</button>
    </div>
    <div class="status" id="status">Predict PI price - Free skill game</div>
  </div>
  <div class="ad-box">Pi Ad Network - Official Ad Space</div>
</div>
<script>
let lang = localStorage.getItem('pibulse_lang')||'en';
const t={
  en:{pts:'Points',live:'PI NETWORK - Live Price',next:'Next round:',up:'📈 UP',down:'📉 DOWN',ready:'Predict PI price - Free skill game',btn:'العربية',noPts:'No points today!'},
  ar:{pts:'نقاطك',live:'شبكة PI - سعر مباشر',next:'الجولة القادمة:',up:'📈 صعود',down:'📉 هبوط',ready:'توقع سعر PI - لعبة مهارة مجانية',btn:'English',noPts:'انتهت نقاط اليوم!'}
};
function applyLang(){
  document.getElementById('html').dir=lang=='ar'?'rtl':'ltr';
  document.getElementById('ptsTxt').innerText=t[lang].pts;
  document.getElementById('liveTxt').innerText=t[lang].live;
  document.getElementById('upBtn').innerText=t[lang].up;
  document.getElementById('downBtn').innerText=t[lang].down;
  document.getElementById('status').innerText=t[lang].ready;
  document.getElementById('langBtn').innerText=t[lang].btn;
}
function toggleLang(){lang=lang=='en'?'ar':'en';localStorage.setItem('pibulse_lang',lang);applyLang();}
applyLang();
let points=parseInt(localStorage.getItem('pibulse_v2_pts')||'10');
function renderPts(){document.getElementById('pts').innerText=points.toLocaleString('en-US');document.getElementById('bar').style.width=(points*10)+'%'}
renderPts();
function play(dir){if(points<=0){document.getElementById('status').innerText=t[lang].noPts;return;}points--;localStorage.setItem('pibulse_v2_pts',points);renderPts();document.getElementById('status').innerText='✅ '+t[lang][dir=='up'?'up':'down'];}

async function fetchPi(){
  try{
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=pi-network&vs_currencies=usd&include_24hr_change=true');
    const data = await res.json();
    const pi = data['pi-network'].usd;
    const chg = data['pi-network'].usd_24h_change;
    document.getElementById('price').innerHTML = '$' + pi.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4}) + '<small style="color:'+(chg>=0?'#00e676':'#ff5252')+'">'+(chg>=0?'+':'')+chg.toFixed(2).toLocaleString('en-US')+'% 24h</small>';
  }catch(e){
    document.getElementById('price').innerText = 'PI Live...';
  }
}
fetchPi();
setInterval(fetchPi,10000);
let sec=60;setInterval(()=>{sec--;if(sec<=0)sec=60;document.getElementById('timer').innerText=t[lang].next+' '+sec.toString().padStart(2,'0')+'s'},1000);
</script>
</body>
</html>
